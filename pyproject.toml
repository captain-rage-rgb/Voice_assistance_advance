[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-computer-agent"
version = "0.1.0"
description = "Real-Time, Streaming, Interruptible Voice-Controlled Computer Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0.0",
    "sounddevice>=0.5.0",
    "numpy>=2.0.0",
    "webrtcvad-wheels>=2.0.10",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
